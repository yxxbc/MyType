name: CI

# 这个仓库只维护 macOS 版：跑核心引擎的单元测试和 macOS 外壳的按键测试。
# 只改了文档的提交不跑。

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # 测试用 -Onone 编译 Swift，CI 上快很多；正式包还是 build.sh 里的 -O
  SWIFT_OPT: -Onone

jobs:
  macos:
    name: 核心 + macOS 外壳
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 核心单元测试
        run: cargo test --locked -p mytype-core --lib
      - name: macOS 外壳测试（不依赖词库数据，用例自己造小词库）
        env:
          # 测试不需要 LTO；正式包还是 Cargo.toml 里的 release 配置
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: macos/test.sh
